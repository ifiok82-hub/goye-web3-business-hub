<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#123B72" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Gold Metallics -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#F3C643"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0B0E14"/>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="210" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="190" stroke="url(#cyanGlow)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Web3 Shield Path -->
  <path d="M256 70 L395 125 V260 C395 348 335 418 256 442 C177 418 117 348 117 260 V125 L256 70 Z" 
        fill="#0D131F" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Cybernetic Circuit Lines -->
  <path d="M160 170 H220 L245 200 H320" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M352 280 H285 L260 310 H175" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Circuit Nodes -->
  <circle cx="160" cy="170" r="5" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="320" cy="200" r="5" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="352" cy="280" r="5" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="175" cy="310" r="5" fill="#00F0FF" filter="url(#glow)"/>

  <!-- Stylized Geometric Golden G Monogram -->
  <path d="M 330 195
           C 305 170 270 160 236 168
           C 192 178 162 216 162 260
           C 162 304 194 340 238 348
           C 278 355 316 338 338 305
           L 338 255
           L 248 255
           L 248 285
           L 305 285
           C 295 308 268 322 242 316
           C 214 310 195 288 195 260
           C 195 230 216 204 245 198
           C 268 193 292 201 308 218
           Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>
