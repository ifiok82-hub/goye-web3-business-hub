  const [piUser,setPiUser]=useState<any>(null)
  const [ready,setReady]=useState(false)
  useEffect(()=>{

        window.Pi.init({version:"2.0", sandbox:true})

        const s=document.createElement('script')
        s.src='https://sdk.minepi.com/pi-sdk.js'

          window.Pi.init({version:"2.0", sandbox:true})
          setReady(true)

'use client'
import { useState, useEffect } from 'react'
export default function PiAuthButton(){
  const [user,setUser]=useState<any>(null)
  const [loading,setLoading]=useState(false)
  useEffect(()=>{
    const saved=localStorage.getItem('pi_user')
    if(saved) setUser(JSON.parse(saved))
  },[])
  const handleAuth=async()=>{
    setLoading(true)
    try{
      if(!window.Pi) {
        const s=document.createElement('script')
        s.src='https://sdk.minepi.com/pi-sdk.js'
        await new Promise((res,rej)=>{ s.onload=res; s.onerror=rej; document.head.appendChild(s) })
      }
      await window.Pi.init({version:"2.0", sandbox:true})
      const auth=await window.Pi.authenticate(["username","payments"],(payment:any)=>{ console.log("incomplete",payment) })
      // auth.user.username should be ifiok1967
      console.log("Pi authenticated",auth.user)
      // Call backend appstudio auth
      await fetch('/api/pi/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:auth.accessToken})})

      await fetch('/api/pi/appstudio-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:auth.accessToken})}).catch(()=>{})
      setUser(auth.user)
      localStorage.setItem('pi_user',JSON.stringify(auth.user))
      alert(\`Welcome @\${auth.user.username}! Pi Auth successful.\`)

      alert(\`Pi Auth failed: \${err.message} - Make sure you are in Pi Browser app, not Chrome\`)

    setLoading(false)

import { NextResponse } from 'next/server'
export async function POST(req:Request){
  try{
    const {accessToken}=await req.json()
    if(!accessToken) return NextResponse.json({error:'no token'}, {status:400})
    const piRes=await fetch('https://api.testnet.minepi.com/v2/me',{headers:{'Authorization':\`Bearer \${accessToken}\`}})
    const piMe=await piRes.json()
    if(!piRes.ok) return NextResponse.json({error:'pi me failed',details:piMe},{status:400})
    return NextResponse.json({success:true,user:piMe})
  }catch(e:any){ return NextResponse.json({error:e.message},{status:500}) }
}
